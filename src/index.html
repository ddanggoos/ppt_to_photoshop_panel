<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="main.bundle.css">
</head>
<body>
  <sp-theme theme="spectrum" color="dark" scale="medium">
    <div class="panel">
      <header class="panel-header">
        <div class="file-info">
          <span id="file-name" class="file-name"></span>
          <span id="slide-info" class="secondary"></span>
        </div>
        <sp-button id="btn-open" variant="secondary" size="s">PPTX 열기</sp-button>
      </header>

      <div class="list-toolbar">
        <sp-checkbox id="select-all">전체 선택</sp-checkbox>
        <span id="selection-count" class="secondary"></span>
      </div>

      <div id="slide-list" class="slide-list"></div>

      <footer class="panel-footer">
        <div class="text-style">
          <select id="font-select" title="폰트"></select>
          <input id="font-size" type="number" min="1" step="1" title="크기 (pt)">
          <span class="secondary">pt</span>
        </div>
        <div class="footer-actions">
          <span id="status" class="status"></span>
          <sp-button id="btn-generate" variant="accent" disabled>생성</sp-button>
        </div>
      </footer>
    </div>
  </sp-theme>

  <script src="main.bundle.js"></script>
</body>
</html>
